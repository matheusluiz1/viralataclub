<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Adoção</title>
    <script src="form.js" defer></script>
   <style>
    body {font-family: Arial, sans-serif; background-image:url('fundo-pet.png');
            background-size: cover;          /* Cobre a tela toda */
            background-position: center;     /* Centraliza a imagem */
            background-attachment: fixed;    /* Fixa o fundo ao rolar */
            margin: 20px;
         }
    h1 {color: #00008B;
        text-align: center;}

.secao {background-color: #00008B;
        color: white;
        padding: 10px;  /* espaço entre o conteúdo e a caixa */
        margin-top: 20px; 
        font-weight: bold;
        text-align: center;}
.container {
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.55); 
            /* Aqui o 0.55 tem como função deixar a caixa mais translucida */
            padding: 20px;
            border: 2px solid #d66b35;
            border-radius: 8px;
            text-align: left;
        }
    
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #d66b35;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 0 auto; /* Aqui centraliza o botão de enviar no final */
        }
        
        button:hover {
            background-color: #b85224;
        }
</style>
</head>

<body>
    <div class="container">
    <div style="text-align: center;">
            <img src="form_pet.png" alt="Banner Vira-lata Club" style="max-width: 600px; height: auto; border-radius: 2px; display: block; margin: 0 auto;">
        </div>
    <h1>Formulário de Adoção | Vira-lata Club</h1>
    <hr>
 <form>
    <div class="secao">DADOS PESSOAIS</div>
            <p style="text-align: center;font-size: 15px;">Que bom que você quer adotar com o Vira-lata Club 🐾</p>
            <hr>
            <label><b>Nome completo:</b></label>
            <input type="text" placeholder="Sua resposta" required>
            

            <label><b>Idade:</b></label>
            <small style="color: #bbb; display: block; margin-top: 5px; margin-bottom: 5px; font-size: 12px;">A adoção será liberada somente para adultos (maiores de 21 anos).</small>
            <input type="number" placeholder="Sua resposta" required>

            <label><b>Telefone com DDD (WhatsApp): *</b></label>
            <input type="number" placeholder="(00) 00000-0000" required>

            <label><b>E-mail:</b></label>
            <input type="email" placeholder="seu@email.com" required>

            <label><b>CEP:</b></label>
            <input type="number" id="cep" placeholder="00000-000" required>

            <label><b>Logradouro:</b></label>
            <input type="text" id="logradouro" placeholder="Sua resposta" required>

            <label><b>Nº:</b></label>
            <input type="number" placeholder="00" required>

            <label><b>Complemento:</b></label>
            <input type="text" placeholder="Ex: Bloco, Apto" required>

            <label><b>Bairro:</b></label>
            <input type="text" id="bairro" placeholder="Sua resposta" required>

            <label><b>UF:</b></label>
            <input type="text" id="uf" placeholder="Ex: SP" required>

            <label><b>Cidade:</b></label>
            <input type="text" id="cidade" placeholder="Sua resposta" required>
            <br>
            <button type="submit">Enviar</button>
        <input type="reset" value="Limpar">


        </form>
</div>
    <center>
    <br>
    <a href="index.html">Voltar</a>
    <br>  <br>  <br>  <br>  <br>
    </center>
</body>
</html>
